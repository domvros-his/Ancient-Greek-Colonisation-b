const STORE={step:0, answers:{}, route:'corinth', shownMap:false, muted:true, visited:0, opened:[], soundCtx:null};

function escapeHtml(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scene(img,body,chip='Εικαστική αναπαράσταση — όχι ιστορικό τεκμήριο') {return `<div class="visual scene-visual"><div class="sceneimg"><img src="${img}" alt="Εικαστική αναπαράσταση αρχαίου ελληνικού λιμανιού"/><span class="source-chip">✦ ${chip}</span></div><div class="scene-story">${body}</div></div>`;}
function question(key, options, conceptTitle, goodIndex, alternatives=[], label='Η απόφαση της τάξης'){const s=STORE.step;let chosen=STORE.answers[s];let buttons=options.map((x,i)=>`<button type="button" class="choice ${chosen===i?'selected':''}" data-action="answer" data-index="${i}" aria-pressed="${chosen===i}"><span class="bullet">${String.fromCharCode(65+i)}</span><span>${escapeHtml(x[0])}</span></button>`).join('');let feedback=chosen===undefined?'':`<div class="feedback" role="status"><div class="concept">${chosen===goodIndex?'Ιστορική ανακάλυψη':'Εξετάζουμε τα τεκμήρια'}</div><strong>${escapeHtml(conceptTitle)}</strong><p>${escapeHtml(options[chosen][1])}<br>${escapeHtml(options[chosen][2])}</p></div>`;return `<div class="decision-label">${label}</div><div class="choices">${buttons}</div>${feedback}`;}
function panel(chapter,title,lede,inner,teacher=''){return `<div class="mission"><div class="chapter">${chapter}</div><h2>${title}</h2><p class="lede">${lede}</p>${inner}${teacher?`<div class="teacher"><b>Για συζήτηση:</b> ${teacher}</div>`:''}</div>`;}
function section(visual,side,kind=''){return `<section class="stage ${kind}">${visual}${side}</section>`;}
function renderIntro(){return `<section class="stage full"><div class="intro" style="background-image:url('${IMG.hero}')"><div class="introcopy"><div class="intro-kicker">Μια ιστορική περιπέτεια · 8ος αιώνας π.Χ.</div><h2>Η πόλη που<br>δεν μας χωράει</h2><div class="intro-lede">Η γη λιγοστεύει. Ο σίδηρος είναι απαραίτητος. Οι πολιτικές αντιπαραθέσεις διχάζουν την πόλη. <strong>Τι θα αποφασίσετε;</strong></div><button type="button" class="intro-cta" data-action="next">Αρχίζει η περιπέτεια →</button><small>Για όλη την τάξη · Συζήτηση, επιλογές, χάρτης και πραγματικά ιστορικά τεκμήρια</small><small>✦ Η εικόνα είναι σύγχρονη εικαστική αναπαράσταση, όχι αρχαιολογική φωτογραφία.</small></div></div></section>`;}
function crisis(){let v=scene(IMG.hero,`<div class="eyebrow">Σκηνή 1 / Η κρίση</div><div class="visual-title">Η πόλη μας πιέζεται.</div><div class="visual-caption">Τρεις φωνές ακούγονται στο συμβούλιο. Τι κοινό έχουν οι ανησυχίες τους;</div><div class="mini-cards"><div class="mini-card"><div class="em">🌾</div><strong>Ο γεωργός</strong><p>«Η γη δεν φτάνει για όλους!»</p></div><div class="mini-card"><div class="em">⚒️</div><strong>Ο τεχνίτης</strong><p>«Χρειαζόμαστε περισσότερο σίδηρο.»</p></div><div class="mini-card"><div class="em">⚖️</div><strong>Ο πολίτης</strong><p>«Οι αντίπαλοι επικράτησαν. Δεν νιώθω ασφαλής.»</p></div></div>`);return section(v,panel('Αποστολή 1 · Αίτια','Γιατί να εγκαταλείψουμε την πόλη;','Ορισμένοι κάτοικοι προτείνουν να εγκατασταθεί μια ομάδα σε νέο τόπο. Τι μπορεί να τους ωθεί;',question('crisis',DATA.crisis,'Τα αίτια του Β΄ Αποικισμού',1), 'Ποιο πρόβλημα αφορά την οικονομία και ποιο την πολιτική;'));}
function leader(){let v=scene(IMG.hero,`<div class="eyebrow">Σκηνή 2 / Συμβούλιο της πόλης</div><div class="visual-title">Χρειαζόμαστε αρχηγό.</div><div class="visual-caption">Η αποστολή δεν μπορεί να οργανωθεί μόνη της.</div><div class="mini-cards"><div class="mini-card"><div class="em">💰</div><strong>Ο πλούσιος</strong><p>«Έχω αρκετά χρήματα.»</p></div><div class="mini-card"><div class="em">🧭</div><strong>Ο έμπειρος</strong><p>«Γνωρίζω να οργανώνω ανθρώπους.»</p></div><div class="mini-card"><div class="em">⚔️</div><strong>Ο ανυπόμονος</strong><p>«Φεύγουμε αμέσως!»</p></div></div>`);return section(v,panel('Αποστολή 2 · Οργάνωση','Ποιος θα οδηγήσει την αποστολή;','Η πόλη πρέπει να ορίσει έναν υπεύθυνο. Ποιο προσόν θα έχει πραγματικά σημασία;',question('leader',DATA.leader,'ΟΙΚΙΣΤΗΣ',1), 'Γιατί η εμπιστοσύνη είναι κρίσιμη όταν αφήνεις πίσω την πατρίδα σου;'));}
function depart(){let v=scene(IMG.hero,`<div class="eyebrow">Σκηνή 3 / Στο λιμάνι</div><div class="visual-title">Η ώρα της αναχώρησης.</div><div class="visual-caption">Οι κάτοικοι συγκεντρώνονται στο λιμάνι. Η αποστολή είναι μια μεγάλη απόφαση για ολόκληρη την πόλη.</div>`);return section(v,panel('Αποστολή 3 · Αναχώρηση','Πριν λύσουμε τα σχοινιά…','Ο οικιστής έχει αναλάβει. Τι γνωρίζουμε για τον τρόπο με τον οποίο οργανωνόταν η αναχώρηση;',question('depart',DATA.depart,'Η αναχώρηση ήταν οργανωμένη',1), 'Τι σημαίνει να αφήνεις πίσω την οικογένεια, τον τόπο και τη γνώριμη ζωή;'));}
function mapVisual(mode='journey') {return `<div class="visual"><div class="mapview"><div class="mapfallback" id="mapFallback"><img src="${IMG.oldmap}" alt="Χάρτης Β΄ αποικισμού του σχολικού βιβλίου"><div style="font-weight:800">Ιστορικός χάρτης από το σχολικό βιβλίο</div><small>Ο διαδραστικός χάρτης Leaflet φορτώνει όταν υπάρχει σύνδεση στο διαδίκτυο.</small></div><div class="realmap" id="leafletMap" aria-label="Διαδραστικός χάρτης Μεσογείου και Εύξεινου Πόντου"></div><div class="map-float"><strong>${mode==='journey'?'🧭 Χάρτης αποστολής':'🌍 Ο ελληνικός κόσμος διευρύνεται'}</strong><span>${mode==='journey'?'Δύο πραγματικά ιστορικά παραδείγματα· η διαδρομή είναι σχηματική.':'Επιλέξτε σημεία στον χάρτη για να γνωρίσετε διαφορετικές αποικίες.'}</span></div></div></div>`;}
function journey(){let dest=STORE.route==='corinth'?'Κόρινθος → Συρακούσες (Σικελία)':'Χαλκίδα → Νάξος (Σικελία)';let picked=STORE.answers[4]!==undefined;let info=picked?`<div class="feedback"><div class="concept">Μια ιστορική διαδρομή</div><strong>${dest}</strong><p>${STORE.route==='corinth'?'Οι Συρακούσες ιδρύθηκαν από Κορινθίους γύρω στο 733 π.Χ.':'Η Νάξος της Σικελίας ιδρύθηκε από Χαλκιδείς γύρω στο 734 π.Χ.'} Το ταξίδι είναι ενδεικτικό: η ακριβής θαλάσσια πορεία δεν αποτυπώνεται εδώ.</p></div>`:'';return section(mapVisual('journey'),panel('Αποστολή 4 · Χάρτης','Πού άπλωσαν πανιά οι Έλληνες;','Ας εξερευνήσουμε δύο πραγματικά παραδείγματα αποικιακών αποστολών. Επιλέξτε μία και παρακολουθήστε την στον χάρτη.',`<div class="choices"><button class="map-picker ${STORE.route==='corinth'?'selected':''}" data-action="route" data-route="corinth"><span class="r">⚓</span><span><b>Κόρινθος → Συρακούσες</b><small>Σικελία · περ. 733 π.Χ.</small></span></button><button class="map-picker ${STORE.route==='chalcis'?'selected':''}" data-action="route" data-route="chalcis"><span class="r">⛵</span><span><b>Χαλκίδα → Νάξος Σικελίας</b><small>Σικελία · περ. 734 π.Χ.</small></span></button></div><button class="map-action" data-action="sail">⛵ Δείτε την πορεία στον χάρτη</button>${info}<div class="hint"><b>Προσοχή:</b> Η Νάξος της Σικελίας δεν είναι το ομώνυμο νησί των Κυκλάδων.</div>`, 'Τι κοινό έχουν οι περιοχές όπου ιδρύθηκαν ελληνικές αποικίες;'),'mapstage');}
function settle(){let v=scene(IMG.hero,`<div class="eyebrow">Σκηνή 5 / Νέα ακτή</div><div class="visual-title">Θα γίνει εδώ η νέα μας πόλη;</div><div class="visual-caption">Ένας ασφαλής τόπος χρειάζεται περισσότερα από ένα όμορφο τοπίο.</div><div class="mini-cards"><div class="mini-card"><div class="em">⚓</div><strong>Απάνεμο λιμάνι</strong><p>Για την επικοινωνία με τη θάλασσα.</p></div><div class="mini-card"><div class="em">🌿</div><strong>Ενδοχώρα</strong><p>Γη που μπορεί να καλλιεργηθεί.</p></div><div class="mini-card"><div class="em">⛰️</div><strong>Φυσική οχύρωση</strong><p>Για προστασία.</p></div></div>`);return section(v,panel('Αποστολή 5 · Εγκατάσταση','Πώς επιλέγεται ο τόπος;','Η ομάδα εξετάζει τρεις πιθανές περιοχές. Ποια συγκεντρώνει τα χαρακτηριστικά που αναζητούσαν συνήθως οι άποικοι;',question('settle',DATA.settle,'ΕΝΔΟΧΩΡΑ · ΛΙΜΑΝΙ · ΠΡΟΣΤΑΣΙΑ',0), 'Γιατί δεν αρκεί από μόνο του ένα καλό λιμάνι;'));}
function locals(){let v=`<div class="visual"><div class="duo"><div class="evidence-card"><div class="big">🏺</div><h3>Λεοντίνοι – Κατάνη</h3><p>Αντικείμενα και τάφοι δίνουν στοιχεία για επαφή και συνύπαρξη Ελλήνων και ντόπιων πληθυσμών.</p><small>Αρχαιολογικές μαρτυρίες στο σχολικό κείμενο</small></div><div class="evidence-card gold"><div class="big">🧱</div><h3>Γέλα – Συρακούσες</h3><p>Οχυρώσεις και μεταβολές σε οικισμούς συνδέονται με περιπτώσεις σύγκρουσης και αντίστασης.</p><small>Αρχαιολογικές μαρτυρίες στο σχολικό κείμενο</small></div></div></div>`;return section(v,panel('Αποστολή 6 · Αρχαιολογία','Και οι άνθρωποι που ζουν ήδη εδώ;','Οι ελληνικές αποικίες δεν ιδρύονταν σε άδειους τόπους. Τι μπορούμε να συμπεράνουμε από τις μαρτυρίες των ανασκαφών;',question('locals',DATA.locals,'Ειρηνικές και συγκρουσιακές σχέσεις',2), 'Γιατί οι αρχαιολόγοι εξετάζουν τους τάφους, τα αντικείμενα και τα οχυρωματικά έργα;'));}

οργανώσει τη ζωή της και να καθορίσει τη σχέση της με την παλιά.',question('city',DATA.city,'ΜΗΤΡΟΠΟΛΗ ΚΑΙ ΑΠΟΙΚΙΑ',1), 'Πώς μπορεί μια πόλη να είναι ανεξάρτητη και ταυτόχρονα να διατηρεί δεσμούς με μια άλλη;'));}
function trade(){let v=`<div class="visual"><div class="exhibit"><div class="museum-chip">Αυθεντικά τεκμήρια από το σχολικό βιβλίο</div><div class="frames"><div class="frame"><img src="${IMG.weigh}" alt="Αρχαία αγγειογραφία, ζύγισμα εμπορευμάτων"/><button class="museum-cta" data-action="zoom" data-img="weigh">🔎 Μεγέθυνση</button><div class="framecap">Ζύγισμα προϊόντων · αγγειογραφία 6ου αι. π.Χ.</div></div><div class="frame"><img src="${IMG.vase}" alt="Αρχαίος κρατήρας από τη Χαλκίδα, 6ος αι. π.Χ."/><button class="museum-cta" data-action="zoom" data-img="vase">🔎 Μεγέθυνση</button><div class="framecap">Κρατήρας της Χαλκίδας · 6ος αι. π.Χ.</div></div></div><div class="exhibit-note">Παρατηρήστε πρώτα τις εικόνες. Τι μπορεί να μας πουν για τις συναλλαγές, την παραγωγή και την επαφή των πόλεων;</div></div></div>`;return section(v,panel('Αποστολή 8 · Οικονομία','Ένας νέος εμπορικός κόσμος','Το εμπόριο αναπτύσσεται. Αυξάνονται οι αγορές και εμφανίζονται νέες επαγγελματικές δραστηριότητες. Πώς ονομάζονταν οι διαφορετικοί τύποι πωλητών;',question('trade',DATA.trade,'ΕΜΠΟΡΟΣ · ΚΑΠΗΛΟΣ',0), 'Ποια ανάγκη εξυπηρετεί το ζύγισμα των εμπορευμάτων;'));}
function finale(){let count=Object.keys(STORE.answers).length;let complete=STORE.answers[9]!==undefined;return section(mapVisual('world'),panel('Αποστολή 9 · Συνέπειες','Τι άλλαξε στον ελληνικό κόσμο;','Ο Β΄ Αποικισμός δημιούργησε εγκαταστάσεις σε πολλές ακτές της Μεσογείου και του Εύξεινου Πόντου.',`<div class="mini-card" style="background:#fff7ecbf;border:1px solid #d9c6aa;"><strong>Παρατηρήστε τον χάρτη</strong><p>Εντοπίστε την Κάτω Ιταλία, τη Σικελία, τον Εύξεινο Πόντο και τη Βόρεια Αφρική. Επιλέξτε ένα σημείο για πληροφορίες.</p></div><div class="decision-label">Ποιο είναι το ιστορικό συμπέρασμα;</div><div class="choices"><button class="choice ${complete?'selected':''}" data-action="final-reveal"><span class="bullet">✓</span><span>Ας αποκαλύψουμε τις σημαντικότερες συνέπειες του αποικισμού.</span></button></div>${complete?`<div class="feedback"><div class="concept">Η ιστορική εικόνα</div><strong>Ο κόσμος αλλάζει</strong><p>Περισσότερες ελληνικές εγκαταστάσεις, ανάπτυξη εμπορίου και αγγειοπλαστικής, νέα επαγγέλματα και επαφές με άλλους λαούς. Η Κάτω Ιταλία ονομάστηκε <b>Μεγάλη Ελλάδα</b> λόγω των πολλών αποικιών.</p></div><button class="map-action" data-action="glossary">📖 Όλες οι έννοιες που ανακαλύψαμε</button>`:''}`, 'Ποια συνέπεια θεωρείτε σημαντικότερη και γιατί;'),'mapstage');}
const RENDERERS=[renderIntro,crisis,leader,depart,journey,settle,locals,city,trade,finale];
function render(){if(leafletMap){leafletMap.remove();leafletMap=null}cancelAnimationFrame(mapAnimation);const s=STORE.step;$('screen').innerHTML=RENDERERS[s]();$('tabs').innerHTML=STEPS.map((t,i)=>`<button type="button" class="stage-tab ${i===s?'active':''} ${i<s?'done':''} ${i>STORE.visited?'locked':''}" data-action="jump" data-step="${i}" ${i>STORE.visited?'disabled':''} aria-current="${i===s?'step':'false'}"><span class="n">${i<s?'✓':i+1}</span><span>${t}</span></button>`).join('');let current=$('tabs').querySelector('.active');current?.scrollIntoView?.({block:'nearest',inline:'nearest'});$('episodeCount').textContent=s===0?'ΠΡΟΛΟΓΟΣ':`ΕΠΕΙΣΟΔΙΟ ${s} / 9`;$('progressFill').style.width=(s/9*100)+'%';let concepts=GLOSS.filter(g=>g[2] <=s && STORE.answers[g[2]]!==undefined).length;$('conceptCount').textContent=`${concepts} / ${GLOSS.length} έννοιες`;$('prev').disabled=s===0;$('next').disabled=s===9||(!STORE.answers.hasOwnProperty(s)&&s>0);$('next').textContent=s===0?'Ξεκινάμε →':s===8?'Τελικός χάρτης →':'Συνεχίζουμε →';if(s===4||s===9)requestAnimationFrame(()=>initMap(s===9?'world':'journey'));}
function selectAnswer(idx){STORE.answers[STORE.step]=idx;ping(750);render();}
function next(){if(STORE.step>=9)return;if(STORE.step>0&&!STORE.answers.hasOwnProperty(STORE.step))return;STORE.step++;STORE.visited=Math.max(STORE.visited,STORE.step);render();ping(550);}
function previous(){if(STORE.step===0)return;STORE.step--;render();}
function ping(f=500){if(STORE.muted)return;try{let Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;let ac=STORE.soundCtx||(STORE.soundCtx=new Audio());let o=ac.createOscillator();let g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.22,ac.currentTime+.12);g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.065,ac.currentTime+.016);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.21);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.23)}catch(e){}}
const CITY={corinth:{name:'Κόρινθος',geo:[37.938,22.933]},syracuse:{name:'Συρακούσες',geo:[37.071,15.292]},chalcis:{name:'Χαλκίδα',geo:[38.462,23.594]},naxos:{name:'Νάξος Σικελίας',geo:[37.824,15.267]},taranto:{name:'Τάρας',geo:[40.473,17.242]},paestum:{name:'Ποσειδωνία',geo:[40.42,15.005]},cyrene:{name:'Κυρήνη',geo:[32.825,21.858]},byzantium:{name:'Βυζάντιο',geo:[41.008,28.977]},olbia:{name:'Ολβία',geo:[46.69,31.884]},miletus:{name:'Μίλητος',geo:[37.532,27.278]},pithec:{name:'Πιθηκούσσες',geo:[40.733,13.949]}};
function initMap(mode){let fallback=$('mapFallback');let target=$('leafletMap');if(!target)return;if(typeof L==='undefined'){target.style.display='none';fallback.style.display='flex';return}fallback.style.display='none';target.style.display='block';try{leafletMap=L.map(target,{zoomControl:true,scrollWheelZoom:false,attributionControl:true,minZoom:3,maxZoom:9,worldCopyJump:true});const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(leafletMap);let points=[];function mk(k,type,extra=''){let a=CITY[k];let ico=L.divIcon({className:'',html:`<div class="mapbadge ${type==='home'?'home':type==='other'?'other':''}">${type==='home'?'⌂':type==='other'?'•':'⚓'}</div>`,iconSize:[30,30],iconAnchor:[15,15]});const m=L.marker(a.geo,{icon:ico}).addTo(leafletMap).bindPopup(`<b>${a.name}</b>${extra?'<br>'+extra:''}`);points.push(a.geo);return m;}
if(mode==='journey'){let pair=STORE.route==='corinth'?['corinth','syracuse']:['chalcis','naxos'];mk(pair[0],'home','Μητρόπολη');mk(pair[1],'dest','Αποικία');leafletMap.fitBounds([CITY[pair[0]].geo,CITY[pair[1]].geo],{padding:[65,65],maxZoom:6});if(STORE.answers[4]!==undefined){let route=[CITY[pair[0]].geo,CITY[pair[1]].geo];L.polyline(route,{color:'#a14c2b',weight:5,opacity:.86,dashArray:'11,9'}).addTo(leafletMap);animateShip(route);}}
else{[['corinth','home','Μητρόπολη'],['chalcis','home','Μητρόπολη'],['syracuse','dest','Αποικία από την Κόρινθο'],['naxos','dest','Αποικία από τη Χαλκίδα'],['taranto','other','Ελληνική αποικία στην Κάτω Ιταλία'],['paestum','other','Ελληνική αποικία στην Κάτω Ιταλία'],['cyrene','other','Ελληνική αποικία στη Βόρεια Αφρική'],['byzantium','other','Ελληνική αποικία στα Στενά'],['olbia','other','Ελληνική αποικία στον Εύξεινο Πόντο'],['miletus','home','Μητρόπολη στην Ιωνία'],['pithec','other','Πρώιμη εγκατάσταση στη Δύση']].forEach(([k,t,extra])=>mk(k,t,extra));leafletMap.fitBounds([[32.0,9.1],[47.7,33.5]],{padding:[23,23]});}
setTimeout(()=>leafletMap?.invalidateSize(),180);}catch(e){console.warn(e);target.style.display='none';fallback.style.display='flex';leafletMap=null}}
function animateShip(coords){if(!leafletMap)return;let mark=L.marker(coords[0],{icon:L.divIcon({className:'',html:'<div class="shipmarker">⛵</div>',iconSize:[40,40],iconAnchor:[19,20]})}).addTo(leafletMap);const started=performance.now(),duration=3400;function frame(now){if(!leafletMap)return;let t=Math.min(1,(now-started)/duration);let ease=t*t*(3-2*t);mark.setLatLng([coords[0][0]+(coords[1][0]-coords[0][0])*ease,coords[0][1]+(coords[1][1]-coords[0][1])*ease]);if(t<1)mapAnimation=requestAnimationFrame(frame)}mapAnimation=requestAnimationFrame(frame)}
function openModal(content){$('overlayRoot').innerHTML=`<div class="modal-cover" data-action="closecover"><div class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-action="close">✕ Κλείσιμο</button>${content}</div></div>`;let close=$('overlayRoot').querySelector('.modal-close');close?.focus();}
function glossary(){let cards=GLOSS.map(([name,def,stage])=>{let unlocked=STORE.answers.hasOwnProperty(stage);return `<div class="gloss-item ${unlocked?'':'locked'}"><strong>${unlocked?'🏺':'🔒'} ${name}</strong><p>${unlocked?def:'Η έννοια θα αποκαλυφθεί σε επόμενο επεισόδιο.'}</p></div>`}).join('');openModal(`<h2>📖 Ο φάκελος των εννοιών</h2><p class="modal-intro">Οι έννοιες εμφανίζονται καθώς η τάξη ολοκληρώνει τις αποστολές.</p><div class="glossary">${cards}</div>`);}
function journal(){const names={1:'Γιατί να φύγουμε;',2:'Ποιος θα οδηγήσει;',3:'Πώς αναχωρούμε;',4:'Πού ταξιδεύουμε;',5:'Πού εγκαθιστάμε;',6:'Πώς αντιμετωπίζουμε τους γείτονες;',7:'Τι σχέση έχουν οι πόλεις;',8:'Πώς αναπτύσσεται το εμπόριο;',9:'Τι άλλαξε;'};let body=Object.entries(names).map(([k,n])=>{let i=Number(k),pick=STORE.answers[i];let txt=i===4?(pick===undefined?'Ακόμη δεν επιλέχθηκε πορεία.':STORE.route==='corinth'?'Κόρινθος → Συρακούσες':'Χαλκίδα → Νάξος Σικελίας'):i===9?(pick===undefined?'Δεν ολοκληρώθηκε.':'Αποκαλύφθηκαν οι συνέπειες.'):pick===undefined?'Δεν έχει αποφασιστεί ακόμη.':(DATA[{1:'crisis',2:'leader',3:'depart',5:'settle',6:'locals',7:'city',8:'trade'}[i]]?.[pick]?.[0]||'');return `<div class="gloss-item ${pick===undefined?'locked':''}"><strong>${i}. ${n}</strong><p>${escapeHtml(txt)}</p></div>`}).join('');openModal(`<h2>📜 Το χρονικό των αποφάσεών μας</h2><p class="modal-intro">Οι επιλογές της τάξης καταγράφονται όσο διαρκεί η παρουσίαση. Δεν αποθηκεύονται σε διακομιστή.</p><div class="glossary">${body}</div><p style="margin-top:20px"><button class="map-action" data-action="reset">↻ Επανεκκίνηση της περιπέτειας</button></p>`);}
function sources(){openModal(`<h2>🏺 Πηγές και εικόνες</h2><div class="credits"><p><b>Αυθεντικά τεκμήρια:</b> Αγγειογραφία με ζύγισμα προϊόντων και κρατήρας της Χαλκίδας, 6ος αι. π.Χ., όπως αναπαράγονται στο σχολικό PDF. Ο χάρτης σε περίπτωση απουσίας Leaflet προέρχεται επίσης από το σχολικό PDF.</p><p><b>Εικαστική αναπαράσταση:</b> Η εικόνα του λιμανιού δημιουργήθηκε για τις ανάγκες της παρουσίασης και δεν αποτελεί ιστορική πηγή ή πιστή ανακατασκευή συγκεκριμένου λιμανιού.</p><p><b>Ιστορική διευκρίνιση:</b> Τα παραδείγματα Χαλκίδας–Νάξου Σικελίας και Κορίνθου–Συρακουσών ακολουθούν τις αρχαίες μαρτυρίες για την ίδρυση των αποικιών. <a href="https://www.livius.org/sources/content/thucydides-historian/the-colonization-of-sicily/" target="_blank" rel="noopener">Θουκυδίδης, Σικελική αποίκηση (6.3–5)</a>. Η εναρκτήρια χρονολογία 750 π.Χ. είναι δραματοποιημένο πλαίσιο· οι δύο ιστορικές ιδρύσεις τοποθετούνται στις επόμενες δεκαετίες. Οι χαρτογραφικές γραμμές είναι σχηματικές και δεν αποδίδουν με ακρίβεια την ιστορική ναυσιπλοΐα.</p><p><b>Διαδραστικός χάρτης:</b> <a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a> και χαρτογραφικά δεδομένα © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>. Τα πλακίδια του χάρτη απαιτούν σύνδεση στο διαδίκτυο.</p><p><b>Πρόσθετες αυθεντικές φωτογραφίες αρχαιολογικών χώρων:</b> <a href="https://commons.wikimedia.org/wiki/File:Paestum_temple.jpg" target="_blank" rel="noopener">Ποσειδωνία/Paestum, Sajeev Puthussery, CC BY-SA 4.0</a> · <a href="https://commons.wikimedia.org/wiki/File:Temple_of_Apollo,_Syracuse,_Sicily.JPG" target="_blank" rel="noopener">Συρακούσες, Laurel Lodged, CC BY-SA 3.0</a>. Πρόκειται για μεταγενέστερα αρχαία μνημεία, όχι εικόνες της στιγμής ίδρυσης των αποικιών.</p></div>`);}
function zoom(name){const photos={
weigh:{img:IMG.weigh,title:'Το ζύγισμα των προϊόντων',caption:'Αγγειογραφία, 6ος αι. π.Χ. · Μητροπολιτικό Μουσείο, Νέα Υόρκη (σύμφωνα με το σχολικό PDF)'},
vase:{img:IMG.vase,title:'Κρατήρας από τη Χαλκίδα',caption:'6ος αι. π.Χ. · Martin von Wagner Museum, Βύρτσμπουργκ (σύμφωνα με το σχολικό PDF)'},
syracuse:{img:EXTERNAL.syracuse,title:'Συρακούσες — Ναός του Απόλλωνα',caption:'Αρχαιολογικός χώρος της Ορτυγίας · Ναός του 6ου αι. π.Χ. · Φωτογραφία: Laurel Lodged · CC BY-SA 3.0.',source:'https://commons.wikimedia.org/wiki/File:Temple_of_Apollo,_Syracuse,_Sicily.JPG'},
paestum:{img:EXTERNAL.paestum,title:'Ποσειδωνία — Ναός της Ήρας II',caption:'Αρχαιολογικός χώρος της Ποσειδωνίας (Paestum) · Ναός του 5ου αι. π.Χ. · Φωτογραφία: Sajeev Puthussery · CC BY-SA 4.0.',source:'https://commons.wikimedia.org/wiki/File:Paestum_temple.jpg'}
};let p=photos[name];if(!p)return;openModal(`<div class="site-zoom-modal"><h2>${p.title}</h2><img src="${p.img}" class="source-photo" alt="${p.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><p class="image-error" style="display:none">Η φωτογραφία δεν φορτώθηκε. Μπορείτε να την προβάλετε στην αρχική πηγή.</p><p class="modal-intro">${p.caption}</p>${p.source?`<p class="modal-intro"><a href="${p.source}" target="_blank" rel="noopener noreferrer">Άνοιγμα αυθεντικής φωτογραφίας και άδειας στη Wikimedia Commons ↗</a></p>`:''}</div>`)}
function reset(){STORE.step=0;STORE.answers={};STORE.route='corinth';STORE.visited=0;$('overlayRoot').innerHTML='';render()}
document.addEventListener('click',(event)=>{let el=event.target.closest('[data-action]');if(!el)return;let act=el.dataset.action;if(act==='closecover'){if(event.target!==el)return;act='close'}switch(act){case 'next':next();break;case 'previous':previous();break;case 'answer':selectAnswer(Number(el.dataset.index));break;case 'route':STORE.route=el.dataset.route;delete STORE.answers[4];render();break;case 'sail':STORE.answers[4]=STORE.route;render();ping(630);break;case 'final-reveal':STORE.answers[9]=true;render();ping(700);break;case 'jump':{let i=Number(el.dataset.step);if(i<=STORE.visited){STORE.step=i;render();}break;}case 'glossary':glossary();break;case 'journal':journal();break;case 'sources':sources();break;case 'zoom':zoom(el.dataset.img);break;case 'close':$('overlayRoot').innerHTML='';break;case 'reset':if(confirm('Να διαγραφούν οι επιλογές και να ξεκινήσει από την αρχή;'))reset();break;case 'sound':STORE.muted=!STORE.muted;$('soundIcon').textContent=STORE.muted?'🔇':'🔊';if(!STORE.muted)ping(600);break;case 'fullscreen':if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.();break;}}
);
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){$('overlayRoot').innerHTML='';return}if($('overlayRoot').firstChild)return;if(e.key==='ArrowRight'&&e.ctrlKey){e.preventDefault();next()}if(e.key==='ArrowLeft'&&e.ctrlKey){e.preventDefault();previous()}});
window.addEventListener('load',()=>{if(STORE.step===4||STORE.step===9)render()});render();
</script></body></html>
